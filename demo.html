<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SurpriseSuite | The Moment</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}#viewport{position:absolute;inset:0;overflow:hidden;background:#000}#cinema{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#3b223c 0%,#15121f 49%,#030306 100%)}#cinema .flow,#mapped .flow{position:absolute;inset:0;overflow:hidden}#mapped{display:none;position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:top left;overflow:hidden;will-change:transform;backface-visibility:hidden}.facet{position:absolute;width:1000px;height:700px;transform-origin:top left;background:#05030a;overflow:hidden;will-change:transform;backface-visibility:hidden}.facet .flow{position:absolute;inset:0}body.mapping #cinema{display:none}body.mapping #mapped{display:block}#veil{position:fixed;inset:0;background:#090810ed;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}#veil .inner{max-width:680px}#veil h1{font:italic clamp(39px,7vw,74px)/1.07 Georgia,serif;color:#f5d4ad;font-weight:400;margin:0 0 18px}#veil p{color:#d0c3ce;font-size:17px}button{cursor:pointer;border:1px solid #9c795d;border-radius:40px;background:#eec58f;padding:12px 22px;color:#261a1c;font-weight:700;font-size:14px}button:hover{background:#ffe1af}.controls{position:fixed;z-index:70;bottom:15px;right:15px;display:flex;gap:7px;flex-wrap:wrap;opacity:.42;transition:opacity .2s}.controls:hover{opacity:1}.controls button{border:1px solid #6a585f;background:#231e29cc;color:#efe3df;font-weight:500;padding:9px 13px}.mainmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:2;padding:8%;color:#fff}.mainmsg .overline{font-size:clamp(12px,1.4vw,23px);letter-spacing:.27em;color:#d3b496;text-transform:uppercase}.mainmsg h2{font:italic clamp(29px,5vw,100px)/1.1 Georgia,serif;max-width:920px;margin:18px 0;color:#ffe5bb;text-shadow:0 0 65px #f1a86d88;overflow-wrap:anywhere}.mainmsg .message{font:normal clamp(15px,2vw,32px)/1.5 Georgia,serif;max-width:740px;color:#f8e5e2}.media{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 1.3s;overflow:hidden;display:flex;align-items:center;justify-content:center}.media .behind{position:absolute;inset:-15%;background-position:center;background-size:cover;filter:blur(45px) brightness(.27) saturate(1.2)}.media img,.media video{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 25px #0009)}.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}.particle{position:absolute;display:block;color:#efbc9b;filter:drop-shadow(0 0 10px #fac17f8a);animation:float linear infinite;opacity:.6;font-size:25px}.aurora{position:absolute;inset:-40%;background:conic-gradient(from 20deg at 50% 50%,#f4a87455,#ffd4ad1c,#765cc766,#241733,#63a9a644,#f4a87455);filter:blur(55px);animation:turn 24s linear infinite;opacity:.4}body.theme-stars .aurora{background:conic-gradient(#11355e,#8492eb33,#102e59,#ac70df66,#11355e)}body.theme-aurora .aurora{background:conic-gradient(#114f42,#47e6b550,#1d2f6e,#aa76d666,#114f42)}@keyframes float{0%{transform:translateY(12vh) rotate(0deg);opacity:0}22%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-108vh) rotate(200deg);opacity:0}}@keyframes turn{to{transform:rotate(360deg)}}#count{position:fixed;left:13px;bottom:13px;z-index:80;color:#ffffff55;font:12px monospace;pointer-events:none}.hidden{display:none!important}.map-label{position:absolute;left:2%;top:2%;z-index:10;background:#000b;color:#d7c4ca;font-size:14px;padding:8px}.calibrate .facet{outline:2px dashed #eebd74}.calibrate .facet:after{content:attr(data-name);position:absolute;top:48%;left:42%;color:#f5e0b7;font-size:30px}.cinema-mode .mainmsg h2{font-size:clamp(40px,5.9vw,103px)}
</style></head><body><div id="viewport"><div id="cinema"><div class="flow"><div class="aurora"></div><div class="particles"></div><div class="media"></div><div class="mainmsg"></div></div></div><div id="mapped"></div></div><div id="veil"><div class="inner"><div style="letter-spacing:4px;font-size:11px;color:#e5b68c;margin-bottom:20px">SURPRISESUITE · THE MOMENT</div><h1 id="welcome">Something wonderful awaits you.</h1><p>This is a moment created just for you. When you're ready, open your surprise.</p><button id="begin">Begin Your Moment ✦</button></div></div><div class="controls"><button id="pause">Pause</button><button id="restart">Replay</button><button id="calibrate">Show Calibration</button><button id="fs">Full Screen</button><button id="mute">Mute</button></div><div id="count"></div><script>
'use strict';let kit={"occasion":"proposal","theme":"bloom","nameA":"Alex","nameB":"Jordan","message":"Hello","finalText":"Will you marry me?","duration":75,"outputMode":"mapping","volume":18,"object":"box","photos":[],"videos":[],"audio":null,"faces":{"table":[[0.13,0.17],[0.87,0.17],[0.91,0.82],[0.09,0.82]],"top":[[0.34,0.28],[0.7,0.28],[0.79,0.49],[0.21,0.49]],"front":[[0.21,0.49],[0.79,0.49],[0.79,0.77],[0.21,0.77]],"side":[[0.79,0.49],[0.87,0.38],[0.87,0.65],[0.79,0.77]]}};let running=false,paused=false,t=0,last=0,music=null,voice=null,voicePlayed=false,photoIndex=-1,showCalibration=false,muted=false,raf=0;const root=document.getElementById('viewport');const cssEscape=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function gaussianMatrix(pts,w,h){let s=[[0,0],[1000,0],[1000,700],[0,700]],a=[],b=[];for(let i=0;i<4;i++){let [x,y]=s[i],X=pts[i][0]*w,Y=pts[i][1]*h;a.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);a.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y)}for(let j=0;j<8;j++){let k=j;for(let n=j+1;n<8;n++)if(Math.abs(a[n][j])>Math.abs(a[k][j]))k=n;if(Math.abs(a[k][j])<1e-8)return '';[a[j],a[k]]=[a[k],a[j]];[b[j],b[k]]=[b[k],b[j]];let v=a[j][j];for(let n=j;n<8;n++)a[j][n]/=v;b[j]/=v;for(let n=0;n<8;n++)if(n!==j){let q=a[n][j];for(let p=j;p<8;p++)a[n][p]-=q*a[j][p];b[n]-=q*b[j]}}let [a0,a1,a2,a3,a4,a5,a6,a7]=b;return 'matrix3d('+[a0,a3,0,a6,a1,a4,0,a7,0,0,1,0,a2,a5,0,1].join(',')+')'}
function createFacet(key){let d=document.createElement('div');d.className='facet';d.dataset.name=key.toUpperCase();d.dataset.face=key;d.innerHTML='<div class="flow"><div class="aurora"></div><div class="particles"></div><div class="media"></div><div class="mainmsg"></div></div>';document.getElementById('mapped').append(d);makeParticles(d.querySelector('.particles'));return d}
function makeParticles(p){p.innerHTML='';for(let i=0;i<32;i++){let s=document.createElement('span');s.className='particle';s.textContent=kit.theme==='bloom'?(i%3?'✿':'✦'):(i%4?'✧':'✦');s.style.left=((i*37+13)%100)+'%';s.style.top=((i*23+11)%90)+'%';s.style.fontSize=(12+(i*7)%35)+'px';s.style.animationDuration=(6+(i*13)%14)+'s';s.style.animationDelay=(-(i*7)%16)+'s';p.append(s)}}
function setup(){document.body.className=(kit.outputMode==='mapping'?'mapping':'cinema')+' theme-'+kit.theme;const m=document.getElementById('mapped');m.innerHTML='';for(const key of kit.object==='table'?['table']:['top','front','side'])createFacet(key);makeParticles(document.querySelector('#cinema .particles'));updateMapping();document.getElementById('welcome').textContent=kit.nameB+', something wonderful awaits you.'}
function updateMapping(){let w=innerWidth,h=innerHeight;for(const f of document.querySelectorAll('.facet')){const mat=gaussianMatrix(kit.faces[f.dataset.face],w,h);f.style.transform=mat||'none'}document.body.classList.toggle('calibrate',showCalibration);document.getElementById('calibrate').textContent=showCalibration?'Hide Calibration':'Show Calibration'}addEventListener('resize',updateMapping);
function txt(n,headline,sub){return '<div class="overline">'+cssEscape(n)+'</div><h2>'+cssEscape(headline)+'</h2>'+(sub?'<div class="message">'+cssEscape(sub)+'</div>':'')}
function sound(){try{const A=window.AudioContext||window.webkitAudioContext;music=new A();const master=music.createGain();master.gain.value=muted?0:kit.volume/100*.13;master.connect(music.destination);music.master=master;const notes=[220,329.63,440,523.25,392,329.63];let nextTime=music.currentTime+.06;function note(freq,when){let o=music.createOscillator(),g=music.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.25,when+.15);g.gain.exponentialRampToValueAtTime(.0001,when+2.3);o.connect(g).connect(master);o.start(when);o.stop(when+2.4)}music.schedule=()=>{while(nextTime<music.currentTime+2.4){note(notes[Math.floor(nextTime*1.4)%notes.length],nextTime);nextTime+=.78}};music.schedule();music.interval=setInterval(()=>{if(running&&!paused)music.schedule()},450)}catch(e){console.warn('Sound unavailable',e)}}
function stopSound(){if(music){clearInterval(music.interval);music.close().catch(()=>{});music=null}}
function renderMedia(target,item){if(!item){target.innerHTML='';target.style.opacity=0;return}const url=item.url;let isVideo=(item.type||'').startsWith('video/');target.innerHTML='<div class="behind"></div>'+(isVideo?'<video autoplay muted playsinline loop></video>':'<img alt="A personal memory">');target.querySelector('.behind').style.backgroundImage='url("'+url+'")';const el=target.querySelector(isVideo?'video':'img');el.src=url;target.style.opacity=1;if(isVideo)el.play().catch(()=>{})}
function frame(dt){if(!running)return;if(!paused)t+=dt;const frac=Math.min(1,t/kit.duration);let phase=frac<.22?'wake':frac<.78?'story':'reveal';let headline='',subtitle='',eyebrow='';if(phase==='wake'){eyebrow='A moment just for '+kit.nameB;headline=kit.nameA+' & '+kit.nameB}else if(phase==='story'){eyebrow='Every moment matters';headline=kit.nameB;subtitle=kit.message}else{eyebrow='This is our moment';headline=kit.finalText;subtitle=kit.nameA+' ♡ '+kit.nameB}
const all=[...document.querySelectorAll('#cinema .flow'),...document.querySelectorAll('.facet .flow')];for(const node of all){const face=node.closest('.facet')?.dataset.face;const isSmallFace=kit.object==='box'&&face&&face!=='front';const title=node.querySelector('.mainmsg');title.innerHTML=txt(eyebrow,isSmallFace?(phase==='reveal'?'♡':'✧'):headline,isSmallFace?'':subtitle);const media=node.querySelector('.media');if(phase==='story'&&!isSmallFace){const total=kit.photos.length+kit.videos.length;let idx=total?Math.floor(((frac-.22)/.56)*Math.max(1,total*2))%total:-1;if(idx!==photoIndex||!media.firstChild){renderMedia(media,idx<0?null:[...kit.photos,...kit.videos][idx]);photoIndex=idx}}else if(media.firstChild){renderMedia(media,null)} }
if(phase==='story'&&kit.audio&&!voicePlayed){voicePlayed=true;voice=new Audio(kit.audio.url);voice.volume=muted?0:.95;voice.play().catch(()=>{});if(music&&!muted)music.master.gain.setTargetAtTime(kit.volume/100*.03,music.currentTime,.2);voice.onended=()=>{if(music&&!muted)music.master.gain.setTargetAtTime(kit.volume/100*.13,music.currentTime,1)}}
if(phase==='reveal'&&voice&&!voice.paused){voice.pause();if(music&&!muted)music.master.gain.setTargetAtTime(kit.volume/100*.15,music.currentTime,.2)}
document.getElementById('count').textContent=Math.floor(t)+' / '+kit.duration+'s';if(frac>=1){running=false;stopSound();return} }
function tick(now){if(!running)return;const dt=Math.min(.07,(now-last)/1000||0);last=now;frame(dt);raf=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(raf);stopSound();if(voice){voice.pause();voice=null}t=0;voicePlayed=false;photoIndex=-1;running=true;paused=false;document.getElementById('veil').classList.add('hidden');document.getElementById('pause').textContent='Pause';sound();last=performance.now();raf=requestAnimationFrame(tick)}
document.getElementById('begin').onclick=start;document.getElementById('restart').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';if(music){if(paused)music.suspend();else music.resume()}if(voice){if(paused)voice.pause();else voice.play().catch(()=>{})}};document.getElementById('calibrate').onclick=()=>{showCalibration=!showCalibration;updateMapping()};document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>alert('Fullscreen is unavailable in this browser.'));document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'Unmute':'Mute';if(music)music.master.gain.setTargetAtTime(muted?0:kit.volume/100*.13,music.currentTime,.15);if(voice)voice.volume=muted?0:.95};window.updateFaces=(newFaces,object)=>{kit.faces=newFaces;if(kit.object!==object){kit.object=object;setup()}else updateMapping()};window.receiveKit=fresh=>{kit=fresh;running=false;cancelAnimationFrame(raf);stopSound();if(voice)voice.pause();document.getElementById('veil').classList.remove('hidden');showCalibration=false;setup()};setup();
</script></body></html>
